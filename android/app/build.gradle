plugins {
       id 'com.android.application' // Ensure AGP is updated to 8.1.0
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services' version "4.3.15" // Ensure latest Google Services plugin
    // END: FlutterFire Configuration
   id 'org.jetbrains.kotlin.android'// Update Kotlin to a stable version (1.8.0 is stable and works well)
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.whitematrix.machinetest"
    compileSdk = 35 // Ensure this matches your desired compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.whitematrix.machinetest"
        minSdk = 23
        targetSdk = 35 // Ensure this matches your compileSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false // Set to true if ProGuard or R8 is configured
            shrinkResources false // Enable resource shrinking if needed
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    ndkVersion = "25.2.9519653" // Ensure this matches the Flutter-recommended NDK version
}

flutter {
    source = "../.."
}
